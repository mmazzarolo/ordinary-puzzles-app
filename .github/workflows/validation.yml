name: Cross-platform validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Types, unit, and browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test

      - name: Verify puzzle pack
        run: pnpm run verify:puzzle-pack

      - name: Install Playwright browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers

      - name: Run browser behavioral matrix
        run: pnpm run e2e
        env:
          ALLOW_FONT_FALLBACK: "1"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
