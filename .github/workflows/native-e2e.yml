name: Native end-to-end

# The browser matrix in "validation.yml" covers the product logic. This workflow
# covers what only a device can show: the app starts, the fonts load, taps and
# drags reach the board, and the storage survives a cold start.
#
# The Android job is on demand for now, because a full device run is slow:
# about 20 minutes, most of it the emulator boot and the Gradle build.
#
# This is a choice about feedback time, not about money. This repository is
# public, so standard GitHub-hosted runners are free on every platform.
#
# Run it from the Actions tab, or locally with "pnpm run e2e:native:android".
#
# iOS runs locally only, with "pnpm run e2e:native:ios" — CI does not run it.
# Note for a possible future revival of an iOS job: SDK 57 needs Xcode 26,
# so it would have to run on "macos-26" or newer. The "macos-15" default of
# Xcode 16.4 cannot parse the swift-tools-version 6.2 manifest that the
# ExpoModulesJSI pod builds, and fails the build with "Could not resolve
# package dependencies".

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.7.0
  # The e2e bundle completes each board on its own, which keeps the flows short
  # and removes the hard-coded gestures the old adb script needed.
  EXPO_PUBLIC_E2E_AUTO_SOLVE: "1"
  # CI has no access to the licensed Averta files.
  ALLOW_FONT_FALLBACK: "1"

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare fonts
        run: pnpm run prepare:fonts

      - name: Generate the native project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build the release APK
        # The Expo template signs release builds with the checked-in debug
        # keystore, so this needs no secrets.
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the Maestro suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          # A long suite exhausts the default emulator graphics stack: the run
          # fills with "Failed to find ColorBuffer" errors and the app stops
          # starting. The software renderer is slower but it survives the suite.
          emulator-options: -no-window -no-snapshot-save -no-boot-anim -noaudio -gpu swiftshader_indirect -camera-back none -camera-front none
          # Keep each command on one line. This action passes the lines to
          # "sh -c" one at a time, so a backslash continuation breaks the
          # command instead of joining it.
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            maestro test --format JUNIT --output maestro-report.xml --test-output-dir maestro-artifacts .maestro || (adb logcat -d > logcat.txt; exit 1)

      - name: Upload the Maestro report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: maestro-android-${{ github.run_attempt }}
          path: |
            maestro-report.xml
            maestro-artifacts/
            logcat.txt
            ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 14
