appId: com.mmazzarolo.ordinarypuzzles
name: Launch with empty storage
---
# Stop the app before the clear. Without this the previous flow can still be
# shutting down when the state reset starts.
#
# The retry covers a simulator behavior, not a defect in the app: a busy
# simulator sometimes kills the process during the launch that follows a state
# reset, and Maestro reports it as "app crashed or stopped". The app writes no
# crash report when this happens. One more attempt clears it.
- stopApp
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - runFlow: assert-home.yaml
